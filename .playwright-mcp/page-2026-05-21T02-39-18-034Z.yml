            - heading "LLM을 활용한 자동화된 고객 응대 시스템을 개발하는 ‘도슨티’" [level=3] [ref=e65]
            - paragraph [ref=e66]: 대화형 인터페이스로 세상 모든 서비스에 혁신을 만들고자 시작
            - figure [ref=e67]:
              - img "[성균관대학교 창업중심대학 스타트업 CEO] LLM을 활용한 자동화된 고객 응대 시스템을 개발하는 ‘도슨티’" [ref=e68]
            - paragraph [ref=e69]: 도슨티는 대형 언어 모델(LLM)을 활용한 자동화된 고객 응대 시스템을 개발하는 스타트업이다. 이일구 대표가 2023년 11월에 설립했다.
            - paragraph [ref=e70]: 이 대표는 한국 KIST에서 로봇 언어를 만드는 연구를 하고, 2개 회사에서 병역특례를 했다. 이후 일본 라인에서 5년 간 SW, ML 엔지니어로 근무했으며, 일본 컨설팅 회사에서 데이터 사이언스 부서를 설립하여 사업화하고 확장했다.
            - paragraph [ref=e71]: 미국 텍사스 주립대에서 연구원 생활을 했고, 미국 본사 테크 스타트업 창업 멤버나 기술 임원을 여러 번 맡았다. 2023년에는 LLM으로 혁신을 만들고자 도슨티를 창업했다.
            - paragraph [ref=e72]: 이 대표는 “도슨티는 LLM을 활용해서 대화형 인터페이스로 세상 모든 서비스에 혁신을 만들고자 시작했다”며 “먼저 이커머스와 기업 내부 업무 자동화에 중점을 두고 있다. 커머스 고객 상담을 자동화하고, 기업 사내 자료 검색을 대화형으로 편리하게 자동화한다”고 말했다.“도슨티는 기업 운영자가 이미 보유하고 있던 자체 자료를 활용 해서 맞춤 AI를 쉽게 만들고, 상담, 업무 자동화 용도로 사용할 수 있는 B2B SaaS입니다. 커머스 고객 상담용, 기업 내부 자료 검색 용 2개 상품이 있습니다. 커머스 업계에서는 고객 상담 업무를 자동화합니다. 심야, 휴일 고객 문의에 대해서도 대기 시간 없이 AI 가 즉시 답변해 주고, 후속 업무 처리까지 자동화합니다. 일반 기업에서는 임직원들이 현장에서 필요한 자료를 자연어로 쉽게 즉시 찾을 수 있어서 편리합니다. 특히 현장이 다양하고 많으면서, 규칙들이 많은 보험, 건설, 금융 등 업계에서 유용합니다.”
            - paragraph [ref=e73]: 이 대표는 “AI를 모르는 사람들도 도슨티를 이용하면, 맞춤 AI를 쉽게 만들 수 있고, 사업에 적용해서 AX를 실현할 수 있다”고 강조했다.
            - paragraph [ref=e74]: “비전문가도 AI 대화 로직을 쉽게 조작할 수 있고, 도슨티 AI 전문가들이 원격으로 지원합니다. 그래서 사업에 더욱 유용하게 활용할 수 있는 AI를 만들어낼 수 있습니다. 커머스에서는 자체적으로 쓰고 있던 상품 안내 문서를 쉽게 학습시킬 수 있고, 운영자가 쉽게 변형해서 AI 답변이 달라지게 조정할 수 있습니다. 기업용 자료 검색 AI는 표, 그림을 자동으로 인식하고, 해당 표, 그림에 대한 속성을 기업 내 도메인 전문가들이 세팅하고 조작할 수 있어서 AI 품질이 지속해서 좋아집니다. 다양한 산업의 인터페이스를 AI 적용한 대화형 인터페이스로 바꾸는 것만으로도 업무 효율화, 자동화를 해내고, 혁신을 만들 수 있습니다.”
            - paragraph [ref=e75]: 판로 개척을 위해 이 대표는 “기회를 만들어서 창의적으로 돌파했고, 지금도 다양한 기회를 만들고 있다”고 말했다.
            - paragraph [ref=e76]: “예를 들면, 위드인천에너지에서는 전화 문의 부담을 줄이고 싶은 니즈가 있었는데, 그러기 위해서는 콜센터 SW 지식이 필요했습니다. 그래서 매트릭스 클라우드라는 콜센터 SW 회사와 회의를 잡아 기술 문의를 하다가 이곳도 AI 챗봇에 관심이 있다는 것을 알게 되었습니다. ‘회의를 마치면서 도슨티 제품 데모를 보여주고, AI 챗봇 필요하지 않으세요’라고 물었고, 이곳에도 도슨티 서비스를 제공하게 되었습니다. 기본적으로는 랜딩 페이지를 홍보하고, 유입된 고객과 도슨티 챗 봇으로 대화하면서 고객을 잡습니다. 나중에는 아웃바운드 AI 챗봇을 이용해서 인스타그램 DM으로 자동으로 영업하려고 합니다. 고객사나 파트너들이 좋은 소감을 주위에 전해 주셔서 큰 힘을 얻고 있습니다.”
            - paragraph [ref=e77]: 도슨티는 2023년 하반기 Primer batch 23기와 시드팁스에 선정 됐으며, 2024년 5월 카이스트청년창업투자지주 시드 투자를 유치했으며, 신보 네스트 프로그램, 11월 팁스 정부지원사업에 뽑혔다. 창업 후 이 대표는 “멤버들과 한마음으로 만들어내서 같이 성취했을 때 보람을 느낀다”고 말했다. 도슨티는 개발자 10명, 디자이너 2명, Product 1명, 사업개발운영 3명으로 구성돼 있다.
            - paragraph [ref=e78]: 앞으로의 계획에 대해 이 대표는 “도슨티 제품을 유용하게 사용하는 팬클럽 만드는 것이 목표”라며 “커머스, 건설, 보험, 법률 등 몇 개 업계에서 AI에서 도슨티를 1등 브랜드로 확립하고 해외에서도 존재감 만들 것”이라고 말했다.“해외에도 진출해 2025년 BEP를 달성하고 일본에 진출할 예정입니다. 2026년 미국에 진출해 법인을 설립하고 북미 등 서양권 글로벌 매출을 동아시아 매출과 유사하게 내는 것이 목표입니다.”
